# Builds the marketing site as a static export and publishes it to GitHub Pages:
# https://rajusomu.github.io/theorycloud-site/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a release that's already going out
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves static files only, so drop the lead API; the contact form falls back to email
      - name: Remove server-only routes
        run: rm -rf src/app/api

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Tell Pages not to run Jekyll, so the _next/ folder is served
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
